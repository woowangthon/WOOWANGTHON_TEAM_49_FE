name: Deploy Frontend

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  # ==========================================
  # 1. Test
  # ==========================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate language packs
        run: npm run i18n:check

      - name: Test with MSW
        run: npm test
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_MOCK_API: "false"

  # ==========================================
  # 2. Build
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/woowangthon/woowangthon_team_49_fe:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://itda.kro.kr/api/v1
            NEXT_PUBLIC_MOCK_API=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 3. Deploy
  # ==========================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VULTR_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to Vultr
        env:
          HOST: ${{ secrets.VULTR_HOST }}
          USER: ${{ secrets.VULTR_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -o BatchMode=yes "$USER@$HOST" \
            "cd /opt/wageitda/frontend && \
             git fetch origin main && \
             git reset --hard origin/main && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f compose.prod.yaml pull && \
             IMAGE_TAG=$IMAGE_TAG docker compose -f compose.prod.yaml up -d --no-build && \
             curl --fail \
                --retry 15 \
                --retry-all-errors \
                --retry-delay 2 \
                --connect-timeout 5 \
                --max-time 10 \
                --silent \
                --show-error \
                --output /dev/null \
                http://127.0.0.1:3000/"
